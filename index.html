<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengumpulan Poster</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Pengumpulan Poster</h2>

    <form id="uploadForm">

      <label for="nama">Nama</label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        required
      >

      <label for="prodi">Prodi</label>

      <input
        type="text"
        id="prodi"
        placeholder="Masukkan program studi"
        required
      >

      <label for="angkatan">Angkatan</label>

      <input
        type="number"
        id="angkatan"
        placeholder="Contoh: 2025"
        required
      >

      <label for="file">File Poster</label>

      <input
        type="file"
        id="file"
        required
      >

      <button type="submit" id="uploadButton">
        Upload
      </button>

      <div id="status"></div>

    </form>

  </div>


  <script>

    // URL Google Apps Script
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbwVHFOcgIImk7xkmCqx49qJPyzGmLot8NKaqTEI9_QcZsuHZ96bel-fOOmfq43fvhg/exec";


    document
      .getElementById("uploadForm")
      .addEventListener("submit", function(e) {

        e.preventDefault();

        const nama =
          document.getElementById("nama").value;

        const prodi =
          document.getElementById("prodi").value;

        const angkatan =
          document.getElementById("angkatan").value;

        const fileInput =
          document.getElementById("file");

        const file =
          fileInput.files[0];

        const button =
          document.getElementById("uploadButton");

        const status =
          document.getElementById("status");


        // Pastikan file dipilih
        if (!file) {

          status.innerText =
            "Pilih file terlebih dahulu.";

          return;

        }


        // Ubah tampilan tombol
        button.disabled = true;

        button.innerText =
          "Mengupload...";

        status.innerText =
          "Sedang mengupload file...";


        // Membaca file
        const reader =
          new FileReader();


        reader.onload = async function() {

          try {

            // Ambil data Base64 dari file
            const base64File =
              reader.result.split(",")[1];


            // Data yang dikirim ke Apps Script
            const data = {

              nama: nama,

              prodi: prodi,

              angkatan: angkatan,

              fileName: file.name,

              mimeType: file.type,

              fileData: base64File

            };


            // Kirim ke Google Apps Script
            await fetch(scriptURL, {

              method: "POST",

              mode: "no-cors",

              headers: {

                "Content-Type":
                  "text/plain"

              },

              body:
                JSON.stringify(data)

            });


            // Karena no-cors tidak bisa membaca
            // response dari Google Apps Script,
            // kita tampilkan pesan berhasil
            status.innerText =
              "File berhasil dikirim!";

            document
              .getElementById("uploadForm")
              .reset();


          } catch (error) {

            console.error(error);

            status.innerText =
              "Terjadi kesalahan saat mengupload.";

          }


          // Aktifkan tombol kembali
          button.disabled = false;

          button.innerText =
            "Upload";

        };


        // Mulai membaca file
        reader.readAsDataURL(file);

      });

  </script>

</body>
</html>
