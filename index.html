<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pengumpulan Poster - Fisip</title>


  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 115, 0, 0.12),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(255, 115, 0, 0.10),
          transparent 25%
        ),
        #080808;

      padding: 30px 18px 50px;

      color: #111;

    }


    /* ==============================
       HEADER FISIP
    ============================== */

    .header {

      text-align: center;

      margin-bottom: 35px;

    }


    .fisip {

      display: inline-block;

      font-size: 68px;

      font-weight: 900;

      font-style: italic;

      letter-spacing: -5px;

      line-height: 1;

      color: white;

      text-shadow:
        3px 3px 0 #111;

      position: relative;

    }


    .fisip .f {

      color: #ff7200;

    }


    .fisip-line {

      width: 210px;

      height: 8px;

      background: #ff7200;

      border-radius: 50%;

      transform: rotate(-5deg);

      margin: 5px auto 0;

    }


    .subtitle {

      color: #aaa;

      font-size: 13px;

      margin-top: 15px;

      letter-spacing: 2px;

      text-transform: uppercase;

    }


    /* ==============================
       AKSEN ORANYE
    ============================== */

    .orange-line {

      position: absolute;

      width: 130px;

      height: 12px;

      background: #ff7200;

      border-radius: 100%;

      transform: rotate(-25deg);

      opacity: 0.8;

      top: 35px;

      left: -45px;

    }


    .orange-line.right {

      left: auto;

      right: -45px;

      top: auto;

      bottom: 30px;

      transform: rotate(-25deg);

    }


    /* ==============================
       CARD
    ============================== */

    .container {

      width: 100%;

      max-width: 650px;

      margin: auto;

      background: #fff;

      padding: 38px 32px;

      border-radius: 25px;

      box-shadow:
        0 15px 45px rgba(0,0,0,0.45);

    }


    h1 {

      text-align: center;

      margin: 0 0 35px;

      font-size: 32px;

      font-weight: 800;

    }


    /* ==============================
       FORM
    ============================== */

    label {

      display: block;

      font-size: 18px;

      font-weight: 700;

      margin-top: 20px;

      margin-bottom: 8px;

    }


    input[type="text"],
    input[type="number"] {

      width: 100%;

      padding: 15px 17px;

      border: 2px solid #d5d5d5;

      border-radius: 12px;

      outline: none;

      font-size: 16px;

      transition: 0.2s;

    }


    input[type="text"]:focus,
    input[type="number"]:focus {

      border-color: #ff7200;

      box-shadow:
        0 0 0 3px rgba(255,114,0,0.12);

    }


    /* ==============================
       FILE INPUT
    ============================== */

    .file-box {

      width: 100%;

      border: 2px solid #d5d5d5;

      border-radius: 12px;

      padding: 8px;

      background: white;

    }


    input[type="file"] {

      width: 100%;

      font-size: 15px;

    }


    /* ==============================
       BUTTON
    ============================== */

    button {

      width: 100%;

      margin-top: 30px;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;

    }


    button:hover {

      background: #ff7200;

    }


    button:active {

      transform: scale(0.98);

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    /* ==============================
       STATUS
    ============================== */

    #status {

      text-align: center;

      margin-top: 18px;

      font-size: 14px;

      line-height: 1.5;

    }


    /* ==============================
       FOOTER
    ============================== */

    .footer {

      text-align: center;

      color: #777;

      font-size: 12px;

      margin-top: 25px;

    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 500px) {

      body {

        padding:
          25px
          14px
          40px;

      }


      .fisip {

        font-size: 58px;

      }


      .fisip-line {

        width: 175px;

      }


      .container {

        padding:
          30px
          20px;

        border-radius: 22px;

      }


      h1 {

        font-size: 28px;

      }


      label {

        font-size: 17px;

      }


      input[type="text"],
      input[type="number"] {

        padding: 14px;

      }

    }

  </style>

</head>


<body>


  <!-- ==============================
       HEADER
  ============================== -->

  <div class="header">

    <div class="orange-line"></div>

    <div class="fisip">

      <span class="f">F</span><span>isip</span>

    </div>

    <div class="fisip-line"></div>

    <div class="subtitle">
      Fakultas Ilmu Sosial dan Ilmu Politik
    </div>

  </div>


  <!-- ==============================
       FORM
  ============================== -->

  <div class="container">


    <h1>
      Pengumpulan Poster
    </h1>


    <form id="uploadForm">


      <label for="nama">
        Nama
      </label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        required
      >


      <label for="prodi">
        Prodi
      </label>

      <input
        type="text"
        id="prodi"
        placeholder="Masukkan program studi"
        required
      >


      <label for="angkatan">
        Angkatan
      </label>

      <input
        type="number"
        id="angkatan"
        placeholder="Contoh: 2025"
        required
      >


      <label for="file">
        File Poster
      </label>

      <div class="file-box">

        <input
          type="file"
          id="file"
          accept="image/*,.pdf"
          required
        >

      </div>


      <button
        type="submit"
        id="uploadButton"
      >
        Upload
      </button>


      <div id="status"></div>


    </form>


  </div>


  <div class="orange-line right"></div>


  <div class="footer">
    Sistem Pengumpulan Poster Fisip
  </div>


  <!--
    IFRAME TERSEMBUNYI

    Tetap digunakan supaya metode
    Form POST ke Apps Script berjalan.
  -->

  <iframe
    name="hiddenFrame"
    id="hiddenFrame"
    style="display:none;"
  ></iframe>


  <script>


    // ==================================================
    // URL GOOGLE APPS SCRIPT
    // ==================================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwCN91EgPhasq55u93s-YSt5SWVKpZQlWo0tfh72T5tPEtxOP0gcUNgE2jr_XzzomYSzA/exec";


    // ==================================================
    // ELEMENT
    // ==================================================

    const form =
      document.getElementById(
        "uploadForm"
      );


    const button =
      document.getElementById(
        "uploadButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    // ==================================================
    // SUBMIT
    // ==================================================

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const nama =
          document.getElementById(
            "nama"
          ).value.trim();


        const prodi =
          document.getElementById(
            "prodi"
          ).value.trim();


        const angkatan =
          document.getElementById(
            "angkatan"
          ).value.trim();


        const fileInput =
          document.getElementById(
            "file"
          );


        const file =
          fileInput.files[0];


        // ==============================================
        // VALIDASI
        // ==============================================

        if (!nama) {

          status.innerText =
            "Nama belum diisi.";

          return;

        }


        if (!prodi) {

          status.innerText =
            "Prodi belum diisi.";

          return;

        }


        if (!angkatan) {

          status.innerText =
            "Angkatan belum diisi.";

          return;

        }


        if (!file) {

          status.innerText =
            "Silakan pilih file poster.";

          return;

        }


        // Maksimal 8 MB

        if (
          file.size >
          8 * 1024 * 1024
        ) {

          status.innerText =
            "Ukuran file maksimal 8 MB.";

          return;

        }


        // ==============================================
        // BUTTON
        // ==============================================

        button.disabled = true;

        button.innerText =
          "Mengupload...";


        status.innerText =
          "Menyiapkan file...";


        // ==============================================
        // BACA FILE
        // ==============================================

        const reader =
          new FileReader();


        reader.onload =
          function() {


            try {


              const base64 =
                reader.result
                .split(",")[1];


              // ========================================
              // BUAT FORM SEMENTARA
              // ========================================

              const uploadForm =
                document.createElement(
                  "form"
                );


              uploadForm.method =
                "POST";


              uploadForm.action =
                SCRIPT_URL;


              uploadForm.target =
                "hiddenFrame";


              uploadForm.style.display =
                "none";


              // ========================================
              // INPUT DATA
              // ========================================

              addInput(
                uploadForm,
                "nama",
                nama
              );


              addInput(
                uploadForm,
                "prodi",
                prodi
              );


              addInput(
                uploadForm,
                "angkatan",
                angkatan
              );


              addInput(
                uploadForm,
                "fileName",
                file.name
              );


              addInput(
                uploadForm,
                "mimeType",
                file.type ||
                "application/octet-stream"
              );


              addInput(
                uploadForm,
                "fileData",
                base64
              );


              // ========================================
              // MASUKKAN FORM
              // ========================================

              document.body.appendChild(
                uploadForm
              );


              status.innerText =
                "Mengirim file ke server...";


              // ========================================
              // KIRIM
              // ========================================

              uploadForm.submit();


              // ========================================
              // SELESAI
              // ========================================

              setTimeout(
                function() {


                  status.innerText =
                    "File berhasil dikirim. Silakan cek Drive dan Spreadsheet.";


                  button.disabled =
                    false;


                  button.innerText =
                    "Upload";


                  uploadForm.remove();


                },
                5000
              );


            } catch (error) {


              console.error(error);


              status.innerText =
                "Terjadi kesalahan: " +
                error.message;


              button.disabled =
                false;


              button.innerText =
                "Upload";

            }

          };


        reader.onerror =
          function() {


            status.innerText =
              "File gagal dibaca.";


            button.disabled =
              false;


            button.innerText =
              "Upload";

          };


        reader.readAsDataURL(
          file
        );

      }
    );


    // ==================================================
    // INPUT TERSEMBUNYI
    // ==================================================

    function addInput(
      form,
      name,
      value
    ) {


      const input =
        document.createElement(
          "input"
        );


      input.type =
        "hidden";


      input.name =
        name;


      input.value =
        value;


      form.appendChild(
        input
      );

    }

  </script>


</body>

</html>
