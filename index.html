<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pengumpulan Poster</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>

</head>

<body>

  <div class="container">

    <h2>Pengumpulan Poster</h2>

    <form
      id="uploadForm"
      enctype="multipart/form-data"
    >

      <label for="nama">
        Nama
      </label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        required
      >

      <label for="prodi">
        Prodi
      </label>

      <input
        type="text"
        id="prodi"
        placeholder="Masukkan program studi"
        required
      >

      <label for="angkatan">
        Angkatan
      </label>

      <input
        type="number"
        id="angkatan"
        placeholder="Contoh: 2025"
        required
      >

      <label for="file">
        File Poster
      </label>

      <input
        type="file"
        id="file"
        accept="image/*,.pdf"
        required
      >

      <button
        type="submit"
        id="uploadButton"
      >
        Upload
      </button>

      <div id="status"></div>

    </form>

  </div>

  <iframe
    name="hiddenFrame"
    id="hiddenFrame"
    style="display:none;"
  ></iframe>

  <script>

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwCN91EgPhasq55u93s-YSt5SWVKpZQlWo0tfh72T5tPEtxOP0gcUNgE2jr_XzzomYSzA/exec";

    const form =
      document.getElementById("uploadForm");

    const button =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const nama =
          document.getElementById("nama").value.trim();

        const prodi =
          document.getElementById("prodi").value.trim();

        const angkatan =
          document.getElementById("angkatan").value.trim();

        const fileInput =
          document.getElementById("file");

        const file =
          fileInput.files[0];

        if (!nama) {
          status.innerText = "Nama belum diisi.";
          return;
        }

        if (!prodi) {
          status.innerText = "Prodi belum diisi.";
          return;
        }

        if (!angkatan) {
          status.innerText = "Angkatan belum diisi.";
          return;
        }

        if (!file) {
          status.innerText = "Pilih file terlebih dahulu.";
          return;
        }

        const maxSize =
          8 * 1024 * 1024;

        if (file.size > maxSize) {
          status.innerText =
            "Ukuran file maksimal 8 MB.";
          return;
        }

        button.disabled = true;
        button.innerText = "Mengupload...";

        status.innerText =
          "Sedang menyiapkan file...";

        const reader =
          new FileReader();

        reader.onload = function() {

          try {

            const base64 =
              reader.result.split(",")[1];

            const uploadForm =
              document.createElement("form");

            uploadForm.method = "POST";
            uploadForm.action = SCRIPT_URL;
            uploadForm.target = "hiddenFrame";
            uploadForm.style.display = "none";

            addInput(
              uploadForm,
              "nama",
              nama
            );

            addInput(
              uploadForm,
              "prodi",
              prodi
            );

            addInput(
              uploadForm,
              "angkatan",
              angkatan
            );

            addInput(
              uploadForm,
              "fileName",
              file.name
            );

            addInput(
              uploadForm,
              "mimeType",
              file.type || "application/octet-stream"
            );

            addInput(
              uploadForm,
              "fileData",
              base64
            );

            document.body.appendChild(
              uploadForm
            );

            status.innerText =
              "Mengirim file ke server...";

            uploadForm.submit();

            setTimeout(
              function() {

                status.innerText =
                  "File sudah dikirim. Silakan cek Drive dan Spreadsheet.";

                button.disabled = false;

                button.innerText = "Upload";

                uploadForm.remove();

              },
              4000
            );

          } catch (error) {

            console.error(error);

            status.innerText =
              "Terjadi kesalahan: " +
              error.message;

            button.disabled = false;

            button.innerText = "Upload";
          }
        };

        reader.onerror = function() {

          status.innerText =
            "File gagal dibaca.";

          button.disabled = false;

          button.innerText = "Upload";
        };

        reader.readAsDataURL(file);

      }
    );

    function addInput(
      form,
      name,
      value
    ) {

      const input =
        document.createElement("input");

      input.type = "hidden";

      input.name = name;

      input.value = value;

      form.appendChild(input);
    }

  </script>

</body>

</html>
