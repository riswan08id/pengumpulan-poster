<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pengumpulan Poster</title>


  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #f5f5f5;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .container {

      width: 100%;

      max-width: 450px;

      background: white;

      padding: 25px;

      border-radius: 15px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.1);

    }


    h2 {

      text-align: center;

      margin-bottom: 25px;

    }


    label {

      display: block;

      margin-top: 15px;

      margin-bottom: 7px;

      font-weight: bold;

    }


    input {

      width: 100%;

      padding: 12px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 15px;

    }


    button {

      width: 100%;

      margin-top: 25px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #222;

      color: white;

      font-size: 16px;

      cursor: pointer;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    #status {

      text-align: center;

      margin-top: 15px;

      font-size: 14px;

    }

  </style>

</head>


<body>


  <div class="container">


    <h2>Pengumpulan Poster</h2>


    <form id="uploadForm">


      <label for="nama">
        Nama
      </label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        required
      >


      <label for="prodi">
        Prodi
      </label>

      <input
        type="text"
        id="prodi"
        placeholder="Masukkan program studi"
        required
      >


      <label for="angkatan">
        Angkatan
      </label>

      <input
        type="number"
        id="angkatan"
        placeholder="Contoh: 2025"
        required
      >


      <label for="file">
        File Poster
      </label>

      <input
        type="file"
        id="file"
        required
      >


      <button
        type="submit"
        id="uploadButton"
      >
        Upload
      </button>


      <div id="status"></div>


    </form>


  </div>


  <!--
    Iframe tersembunyi.
    Digunakan untuk menerima hasil dari Apps Script
    tanpa reload halaman utama.
  -->

  <iframe
    name="uploadFrame"
    id="uploadFrame"
    style="display:none;"
  ></iframe>


  <script>


    const scriptURL =
      "https://script.google.com/macros/s/AKfycbwVHFOcgIImk7xkmCqx49qJPyzGmLot8NKaqTEI9_QcZsuHZ96bel-fOOmfq43fvhg/exec";


    const form =
      document.getElementById("uploadForm");


    const button =
      document.getElementById("uploadButton");


    const status =
      document.getElementById("status");


    const frame =
      document.getElementById("uploadFrame");


    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const nama =
          document.getElementById("nama").value.trim();


        const prodi =
          document.getElementById("prodi").value.trim();


        const angkatan =
          document.getElementById("angkatan").value.trim();


        const fileInput =
          document.getElementById("file");


        const file =
          fileInput.files[0];


        if (!file) {

          status.innerText =
            "Pilih file terlebih dahulu.";

          return;

        }


        button.disabled = true;

        button.innerText =
          "Mengupload...";


        status.innerText =
          "Sedang mengupload file...";


        try {


          // Baca file
          const reader =
            new FileReader();


          reader.onload = function() {


            const base64File =
              reader.result.split(",")[1];


            /*
              Buat form sementara.
              Form ini dikirim langsung ke
              Google Apps Script.
            */

            const uploadForm =
              document.createElement("form");


            uploadForm.method =
              "POST";


            uploadForm.action =
              scriptURL;


            uploadForm.target =
              "uploadFrame";


            uploadForm.enctype =
              "application/x-www-form-urlencoded";


            uploadForm.style.display =
              "none";


            // Nama
            addField(
              uploadForm,
              "nama",
              nama
            );


            // Prodi
            addField(
              uploadForm,
              "prodi",
              prodi
            );


            // Angkatan
            addField(
              uploadForm,
              "angkatan",
              angkatan
            );


            // Nama file
            addField(
              uploadForm,
              "fileName",
              file.name
            );


            // MIME type
            addField(
              uploadForm,
              "mimeType",
              file.type ||
              "application/octet-stream"
            );


            // Data Base64
            addField(
              uploadForm,
              "fileData",
              base64File
            );


            // Masukkan form ke halaman
            document.body.appendChild(
              uploadForm
            );


            // Kirim
            uploadForm.submit();


            /*
              Jangan langsung reset form.
              Kita tunggu sebentar agar request
              punya waktu sampai ke Apps Script.
            */

            status.innerText =
              "File sedang dikirim ke server...";


            setTimeout(function() {


              status.innerText =
                "Pengiriman selesai. Silakan cek Google Drive dan Spreadsheet.";


              button.disabled =
                false;


              button.innerText =
                "Upload";


              /*
                Form sementara dihapus.
              */

              uploadForm.remove();


            }, 3000);


          };


          reader.onerror = function() {

            throw new Error(
              "File gagal dibaca."
            );

          };


          reader.readAsDataURL(file);


        } catch (error) {


          console.error(error);


          status.innerText =
            "Upload gagal: " +
            error.message;


          button.disabled =
            false;


          button.innerText =
            "Upload";

        }

      }
    );


    /*
      Fungsi membuat input tersembunyi
      untuk form pengiriman.
    */

    function addField(
      form,
      name,
      value
    ) {


      const input =
        document.createElement("input");


      input.type =
        "hidden";


      input.name =
        name;


      input.value =
        value;


      form.appendChild(
        input
      );

    }


  </script>


</body>

</html>
